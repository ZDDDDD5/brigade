<!doctype html>
<!-- The dashboard window's own page (src/windows.ts): behind the dashboard's view, it shows only
     as the band above it that keeps the window's buttons. Only that band moves the window: a drag
     area under the view would take the view's clicks (macOS gives them to the window). The app
     sets the band's height as the view moves. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Brigade</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }
      #band {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 0;
        -webkit-app-region: drag;
        app-region: drag;
      }
    </style>
  </head>
  <body>
    <div id="band"></div>
  </body>
</html>
